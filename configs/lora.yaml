# ----- LoRA finetuning run configs -----
name: lora_a8

# model / paths
pretrained_path: data/weights/v1-5-pruned-emaonly.safetensors
device: cuda

# data
dataset: persian
# lora
r: 16
alpha: 8
targets:
  desc: selfcrossffn
  layers: ["q1", "k1", "v1", "proj_out1", "q2", "k2", "v2", "proj_out2", "geglu_in", "geglu_out"]

# training
n_epochs: 10
batch_size: 8
lr: 0.0001
seed: 42
log_interval: 10
